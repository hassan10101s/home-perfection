<section class="hp-quote-intro" aria-label="عن حساب تكلفة النقل">
<h2>احسب تكلفة النقل</h2>
<p>تكلفة النقل يتم حسابها بناء علي المعلومات المقدمة وسيتم أرسال رسالة لكم بها التكلفة الفعلية للنقل حيث نسعي لتقديم عرض سعر عادل للعملاء لتكون ارشاد لهم في عملية النقل وهذا جزء من ثقافتنا وهو مساعدة الاخريين في اختيار الشركة التي تناسبهم.</p>
